name: Build and Push Frontend Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push-frontend:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # (اختياري) لو عايز تشغل tests قبل ما تبني الصورة
      # - name: Set up Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      #
      # - name: Install deps
      #   run: npm ci
      #
      # - name: Run tests
      #   run: npm test

      # 3) Build + Push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .                # جذر مشروع الفرونت
          file: ./Dockerfile       # الـ Dockerfile اللي عملناه للfrontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/opinia-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/opinia-frontend:${{ github.sha }}
